[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "filiz-sozluk"
version = "0.1.0"
description = "Filiz: küçük Türkçe dil modelleri için kök-ek sözlüğü / Turkish root-suffix tokenizer for the Filiz models"
readme = "README.md"
license = {text = "Apache-2.0"}
authors = [{name = "Samet Türkan", email = "smtturkan@gmail.com"}]
requires-python = ">=3.9"

dependencies = ["tokenizers>=0.15"]

[tool.setuptools]
packages = ["filiz_sozluk"]

[tool.setuptools.package-data]
filiz_sozluk = ["veri/*.json"]

[project.urls]
Homepage = "https://github.com/smtturkan-droid/filiz"
Model = "https://huggingface.co/smtturkan/filiz-118m"
